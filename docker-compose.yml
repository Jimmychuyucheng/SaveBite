# 本機開發用的 PostgreSQL 與 Redis（雲端分別對應 RDS 與 ElastiCache）。
# 啟動：docker compose up -d　　停止：docker compose down　　清空資料：docker compose down -v
#
# 帳密從 repo 根目錄的 .env 讀取（複製 .env.example 後填入），不寫在這個檔案裡。
# port 只綁 127.0.0.1，不讓區網內的其他電腦連進來。

name: savebite

services:
  postgres:
    image: postgres:16            # 和 RDS 一樣用 PostgreSQL 16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?請在 .env 設定 POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?請在 .env 設定 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?請在 .env 設定 POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7                # ElastiCache 也用 Redis 7
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:

AWSTemplateFormatVersion: "2010-09-09"
# SaveBite 基礎 stack（免費或幾乎免費，常駐）：Cognito user pool 與
# public app client、S3 照片 bucket、新貼文 Email 通知的 SNS topic、
# SQS 失敗佇列（DLQ），以及 EventBridge Scheduler 的 schedule group。
#
# 注意：模板與參數的 Description 要維持英文。實測 CloudFormation 會把
# Description 裡的中文換成「?」；以 # 開頭的註解不會送到 AWS，可以用中文。
Description: >
  SaveBite base stack (free or near-free, long-lived): Cognito user pool and
  public app client, S3 photo bucket, SNS topic for new-listing emails,
  SQS dead-letter queue, and the EventBridge Scheduler schedule group.

Parameters:
  PhotoCorsOrigins:
    Type: CommaDelimitedList
    Default: "*"
    # 允許瀏覽器對照片 bucket 做 PUT／GET 的來源。開發期用 "*"；
    # runtime stack 建好後改成 ALB 網址與 localhost（見 ARCHITECTURE.md §6.10）。
    Description: >
      Allowed origins for browser PUT/GET to the photo bucket. Use "*" during
      development; once the runtime stack exists, change to
      http://<ALB DNS>,http://localhost:5173,http://localhost:8000
  PhotoRetentionDays:
    Type: Number
    Default: 30
    MinValue: 1

Resources:
  # ---------- Cognito ----------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: savebite-users
      UsernameAttributes: [email]          # 用 email 登入
      AutoVerifiedAttributes: [email]      # 註冊時寄 email 驗證碼
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false    # 開放自行註冊
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
        - Name: name
          AttributeDataType: String
          Required: true
          Mutable: true
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireUppercase: false
          RequireSymbols: false
          TemporaryPasswordValidityDays: 7
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      EmailConfiguration:
        EmailSendingAccount: COGNITO_DEFAULT   # 內建寄信每天約 50 封上限
      MfaConfiguration: "OFF"

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: savebite-web
      UserPoolId: !Ref UserPool
      GenerateSecret: false                # public client：不需要 SECRET_HASH
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  # ---------- S3 照片 ----------
  PhotoBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub savebite-photos-${AWS::AccountId}
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [PUT, GET]
            AllowedOrigins: !Ref PhotoCorsOrigins
            AllowedHeaders: ["*"]
            ExposedHeaders: [ETag]
            MaxAge: 3000
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-photos
            Status: Enabled
            Prefix: photos/
            ExpirationInDays: !Ref PhotoRetentionDays
          - Id: abort-incomplete-multipart
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  # ---------- S3 部署檔 ----------
  # 放後端打包檔（releases/backend-<git sha>.tar.gz），EC2 開機時經 S3 Gateway Endpoint 下載。
  # 和照片 bucket 分開：權限、CORS、Lifecycle 的需求都不同。
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub savebite-artifacts-${AWS::AccountId}
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-releases
            Status: Enabled
            Prefix: releases/
            ExpirationInDays: 60

  # ---------- SNS ----------
  NewListingTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: savebite-new-listings
      DisplayName: SaveBite

  # ---------- SQS DLQ ----------
  DeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: savebite-dlq
      MessageRetentionPeriod: 1209600   # 14 天

  # ---------- EventBridge Scheduler ----------
  ScheduleGroup:
    Type: AWS::Scheduler::ScheduleGroup
    Properties:
      Name: savebite

Outputs:
  UserPoolId:
    Value: !Ref UserPool
    Export: { Name: !Sub "${AWS::StackName}-UserPoolId" }
  UserPoolArn:
    Value: !GetAtt UserPool.Arn
    Export: { Name: !Sub "${AWS::StackName}-UserPoolArn" }
  UserPoolClientId:
    Value: !Ref UserPoolClient
    Export: { Name: !Sub "${AWS::StackName}-UserPoolClientId" }
  PhotoBucketName:
    Value: !Ref PhotoBucket
    Export: { Name: !Sub "${AWS::StackName}-PhotoBucket" }
  PhotoBucketArn:
    Value: !GetAtt PhotoBucket.Arn
    Export: { Name: !Sub "${AWS::StackName}-PhotoBucketArn" }
  ArtifactBucketName:
    Value: !Ref ArtifactBucket
    Export: { Name: !Sub "${AWS::StackName}-ArtifactBucket" }
  NewListingTopicArn:
    Value: !Ref NewListingTopic
    Export: { Name: !Sub "${AWS::StackName}-NewListingTopicArn" }
  DeadLetterQueueArn:
    Value: !GetAtt DeadLetterQueue.Arn
    Export: { Name: !Sub "${AWS::StackName}-DlqArn" }
  DeadLetterQueueUrl:
    Value: !Ref DeadLetterQueue
    Export: { Name: !Sub "${AWS::StackName}-DlqUrl" }
  ScheduleGroupName:
    Value: !Ref ScheduleGroup
    Export: { Name: !Sub "${AWS::StackName}-ScheduleGroup" }

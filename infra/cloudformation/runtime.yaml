AWSTemplateFormatVersion: "2010-09-09"
# SaveBite runtime stack（會計費，用完當天就刪除）。
#
# 分段建立：
#   第一段：NAT Gateway、ALB、Launch Template、Auto Scaling group（EC2 × 2）
#   第二段（本次加入）：RDS（密碼由 Secrets Manager 管理）、ElastiCache Redis、
#           Secrets Manager interface endpoint、Lambda（佔位程式）、安全網掃描的 EventBridge rule
#   第三段（之後）：CloudWatch 告警與 dashboard
#
# 依賴：savebite-network（子網路、路由表、SG）、savebite-base（部署檔 bucket、Cognito、SNS、DLQ 等）的 export。
#
# 注意：模板與參數的 Description、SG 的 GroupDescription 要維持英文
#（實測 CloudFormation 會把 Description 的中文換成「?」；SG 描述只能用 ASCII）。
Description: >
  SaveBite runtime stack (billed; delete after use). NAT Gateway(s), ALB,
  Auto Scaling group of two EC2 instances, RDS PostgreSQL, ElastiCache Redis,
  Secrets Manager interface endpoint, and the release Lambda with its sweep rule.

Parameters:
  NetworkStackName:
    Type: String
    Default: savebite-network
  BaseStackName:
    Type: String
    Default: savebite-base
  NatGatewayCount:
    Type: String
    AllowedValues: ["1", "2"]
    Default: "1"
    Description: 1 = single NAT in AZ-a (development); 2 = one NAT per AZ (HA experiments).
  RdsMultiAz:
    Type: String
    AllowedValues: ["false", "true"]
    Default: "false"
    Description: true for the RDS failover experiment (roughly doubles RDS cost).
  InstanceType:
    Type: String
    AllowedValues: [t3.micro, t3.small, t3.medium]
    Default: t3.small
  DbInstanceClass:
    Type: String
    AllowedValues: [db.t3.micro, db.t3.small, db.t4g.micro]
    Default: db.t3.micro
  CacheNodeType:
    Type: String
    AllowedValues: [cache.t3.micro, cache.t4g.micro]
    Default: cache.t3.micro
  LatestAmiId:
    # Amazon Linux 2023 最新 AMI（由 AWS 公開的 SSM 參數解析）
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  AppArtifactKey:
    Type: String
    AllowedPattern: "releases/backend-[0-9a-f]+\\.tar\\.gz"
    Description: S3 key of the backend package in the artifact bucket (from scripts/package-backend.sh).
  AppEnv:
    Type: String
    AllowedValues: [dev, loadtest, prod]
    Default: dev
  ReservationHoldMinutes:
    Type: Number
    Default: 30
    MinValue: 1

Conditions:
  TwoNats: !Equals [!Ref NatGatewayCount, "2"]

Resources:
  # ======================================================================
  # 第一段：NAT、ALB、EC2
  # ======================================================================

  # ---------- NAT Gateway ----------
  NatEipA:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags: [{ Key: Name, Value: savebite-nat-a }]

  NatGatewayA:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEipA.AllocationId
      SubnetId: !ImportValue { "Fn::Sub": "${NetworkStackName}-PublicSubnetA" }
      Tags: [{ Key: Name, Value: savebite-nat-a }]

  NatEipB:
    Type: AWS::EC2::EIP
    Condition: TwoNats
    Properties:
      Domain: vpc
      Tags: [{ Key: Name, Value: savebite-nat-b }]

  NatGatewayB:
    Type: AWS::EC2::NatGateway
    Condition: TwoNats
    Properties:
      AllocationId: !GetAtt NatEipB.AllocationId
      SubnetId: !ImportValue { "Fn::Sub": "${NetworkStackName}-PublicSubnetB" }
      Tags: [{ Key: Name, Value: savebite-nat-b }]

  # 應用子網路的對外路由：NatGatewayCount=1 時兩個 AZ 都走 AZ-a 的 NAT
  AppRouteA:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !ImportValue { "Fn::Sub": "${NetworkStackName}-AppRouteTableA" }
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGatewayA

  AppRouteB:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !ImportValue { "Fn::Sub": "${NetworkStackName}-AppRouteTableB" }
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !If [TwoNats, !Ref NatGatewayB, !Ref NatGatewayA]

  # ---------- ALB ----------
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: savebite-alb
      Scheme: internet-facing
      Type: application
      Subnets:
        - !ImportValue { "Fn::Sub": "${NetworkStackName}-PublicSubnetA" }
        - !ImportValue { "Fn::Sub": "${NetworkStackName}-PublicSubnetB" }
      SecurityGroups:
        - !ImportValue { "Fn::Sub": "${NetworkStackName}-AlbSg" }
      LoadBalancerAttributes:
        - Key: idle_timeout.timeout_seconds
          Value: "60"                 # WebSocket 心跳 30 秒，小於這個值
      Tags: [{ Key: Name, Value: savebite-alb }]

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: savebite-app-tg
      VpcId: !ImportValue { "Fn::Sub": "${NetworkStackName}-VpcId" }
      Protocol: HTTP
      Port: 8000
      TargetType: instance
      HealthCheckProtocol: HTTP
      HealthCheckPath: /health          # 只確認程式活著，不檢查 RDS／Redis（§6.7）
      HealthCheckIntervalSeconds: 10
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2        # 約 20 秒判定不健康，故障實驗比較快看到效果
      Matcher: { HttpCode: "200" }
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "30"                   # 預設 300 秒太長，換機或實驗時等太久
        - Key: stickiness.enabled
          Value: "false"                # 推播靠 Redis 跨機同步，不需要黏著同一台

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # ---------- EC2 ----------
  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: savebite-app
      TagSpecifications:
        - ResourceType: launch-template
          Tags: [{ Key: Name, Value: savebite-app }]
      LaunchTemplateData:
        ImageId: !Ref LatestAmiId
        InstanceType: !Ref InstanceType
        IamInstanceProfile:
          Name: LabInstanceProfile      # Learner Lab 現成的；SSM、S3、Secrets Manager 都靠它
        SecurityGroupIds:
          - !ImportValue { "Fn::Sub": "${NetworkStackName}-AppSg" }
        MetadataOptions:
          HttpTokens: required          # 只允許 IMDSv2
          HttpEndpoint: enabled
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - { Key: Name, Value: savebite-app }
              - { Key: project, Value: savebite }
          - ResourceType: volume
            Tags:
              - { Key: Name, Value: savebite-app }
              - { Key: project, Value: savebite }
        UserData:
          Fn::Base64:
            Fn::Sub:
              - |
                #!/bin/bash
                # 開機設定：安裝 Python 3.11 → 從 S3 下載後端 → 從 Secrets Manager 取得 DB 密碼
                # → 寫入環境變數 → 用 systemd 啟動 uvicorn → 回報 CloudFormation
                set -euxo pipefail
                exec > >(tee /var/log/savebite-userdata.log) 2>&1

                signal() {
                  /opt/aws/bin/cfn-signal -e "$1" --stack ${AWS::StackName} \
                    --resource AppAutoScalingGroup --region ${AWS::Region} || true
                }
                # 任何一步失敗都回報失敗，CloudFormation 才不會空等到逾時
                trap 'signal 1' ERR

                dnf install -y python3.11 python3.11-pip aws-cfn-bootstrap

                useradd --system --home-dir /opt/savebite --shell /sbin/nologin savebite || true
                mkdir -p /opt/savebite /etc/savebite

                aws s3 cp s3://${ArtifactBucket}/${AppArtifactKey} /tmp/backend.tar.gz --region ${AWS::Region}
                rm -rf /opt/savebite/backend
                tar -xzf /tmp/backend.tar.gz -C /opt/savebite     # 解出 /opt/savebite/backend
                python3.11 -m venv /opt/savebite/venv
                /opt/savebite/venv/bin/pip install --no-cache-dir -r /opt/savebite/backend/requirements.txt
                chown -R savebite:savebite /opt/savebite

                # 從 Secrets Manager 取得 RDS 主帳密，組成 DATABASE_URL（帳密做 URL 編碼）。
                # 密碼不進 user data、不進 CloudFormation 參數，只寫進權限 640 的 /etc/savebite/env。
                set +x   # 下面幾行不要把密碼印進日誌
                SECRET_JSON=$(aws secretsmanager get-secret-value --secret-id '${DbSecretArn}' \
                  --region ${AWS::Region} --query SecretString --output text)
                DATABASE_URL=$(SECRET_JSON="$SECRET_JSON" python3.11 -c 'import json, os, urllib.parse as up; s = json.loads(os.environ["SECRET_JSON"]); print("postgresql://" + up.quote(s["username"], safe="") + ":" + up.quote(s["password"], safe="") + "@${DbHost}:${DbPort}/savebite")')
                unset SECRET_JSON

                # 環境變數（見 ARCHITECTURE.md §8.3）。EC2 上不設 AWS_PROFILE，改用 LabInstanceProfile
                umask 027
                {
                  echo "APP_ENV=${AppEnv}"
                  echo "AWS_REGION=${AWS::Region}"
                  echo "DATABASE_URL=$DATABASE_URL"
                  echo "REDIS_URL=redis://${RedisHost}:${RedisPort}/0"
                  echo "COGNITO_USER_POOL_ID=${UserPoolId}"
                  echo "COGNITO_APP_CLIENT_ID=${UserPoolClientId}"
                  echo "PHOTO_BUCKET=${PhotoBucket}"
                  echo "SNS_TOPIC_ARN=${TopicArn}"
                  echo "RELEASE_LAMBDA_ARN=${ReleaseFunction.Arn}"
                  echo "SCHEDULER_ROLE_ARN=arn:aws:iam::${AWS::AccountId}:role/LabRole"
                  echo "SCHEDULER_GROUP=${ScheduleGroup}"
                  echo "SCHEDULER_DLQ_ARN=${DlqArn}"
                  echo "RESERVATION_HOLD_MINUTES=${ReservationHoldMinutes}"
                } > /etc/savebite/env
                unset DATABASE_URL
                set -x
                chown root:savebite /etc/savebite/env
                chmod 640 /etc/savebite/env

                cat > /etc/systemd/system/savebite.service <<'UNITEOF'
                [Unit]
                Description=SaveBite FastAPI
                After=network-online.target
                Wants=network-online.target

                [Service]
                User=savebite
                WorkingDirectory=/opt/savebite/backend
                EnvironmentFile=/etc/savebite/env
                ExecStart=/opt/savebite/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips '*'
                Restart=always
                RestartSec=3

                [Install]
                WantedBy=multi-user.target
                UNITEOF

                systemctl daemon-reload
                systemctl enable --now savebite

                # 等本機 /health 回 200 才回報成功
                for i in $(seq 1 30); do
                  if curl -fsS http://127.0.0.1:8000/health; then signal 0; exit 0; fi
                  sleep 2
                done
                signal 1
              - ArtifactBucket: !ImportValue { "Fn::Sub": "${BaseStackName}-ArtifactBucket" }
                DbSecretArn: !GetAtt Database.MasterUserSecret.SecretArn
                DbHost: !GetAtt Database.Endpoint.Address
                DbPort: !GetAtt Database.Endpoint.Port
                RedisHost: !GetAtt RedisCluster.RedisEndpoint.Address
                RedisPort: !GetAtt RedisCluster.RedisEndpoint.Port
                UserPoolId: !ImportValue { "Fn::Sub": "${BaseStackName}-UserPoolId" }
                UserPoolClientId: !ImportValue { "Fn::Sub": "${BaseStackName}-UserPoolClientId" }
                PhotoBucket: !ImportValue { "Fn::Sub": "${BaseStackName}-PhotoBucket" }
                TopicArn: !ImportValue { "Fn::Sub": "${BaseStackName}-NewListingTopicArn" }
                ScheduleGroup: !ImportValue { "Fn::Sub": "${BaseStackName}-ScheduleGroup" }
                DlqArn: !ImportValue { "Fn::Sub": "${BaseStackName}-DlqArn" }

  AppAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    CreationPolicy:
      ResourceSignal:
        Count: 2                        # 兩台都回報成功，stack 才算建立完成
        Timeout: PT15M
    UpdatePolicy:
      # 換新版本（AppArtifactKey 或 Launch Template 改變）時一次換一台，至少保留 1 台服務
      AutoScalingRollingUpdate:
        MinInstancesInService: 1
        MaxBatchSize: 1
        PauseTime: PT15M
        WaitOnResourceSignals: true
    # 開機時要經 NAT 安裝套件，並經 VPC endpoint 讀 Secrets Manager
    DependsOn: [AppRouteA, AppRouteB, SecretsManagerEndpoint]
    Properties:
      AutoScalingGroupName: savebite-app-asg
      MinSize: "2"                      # 固定 2 台：目的是容錯，不做擴展（§4.2）
      MaxSize: "2"
      DesiredCapacity: "2"
      VPCZoneIdentifier:
        - !ImportValue { "Fn::Sub": "${NetworkStackName}-AppSubnetA" }
        - !ImportValue { "Fn::Sub": "${NetworkStackName}-AppSubnetB" }
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      TargetGroupARNs: [!Ref TargetGroup]
      HealthCheckType: ELB              # 依 ALB 健康檢查判斷，程式掛了也會被替換
      HealthCheckGracePeriod: 300       # 開機安裝套件約需幾分鐘
      Tags:
        - { Key: project, Value: savebite, PropagateAtLaunch: true }

  # ======================================================================
  # 第二段：RDS、ElastiCache、Secrets Manager endpoint、Lambda
  # ======================================================================

  # ---------- RDS PostgreSQL ----------
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupName: savebite-db-subnets
      DBSubnetGroupDescription: SaveBite RDS in private data subnets
      SubnetIds:
        - !ImportValue { "Fn::Sub": "${NetworkStackName}-DataSubnetA" }
        - !ImportValue { "Fn::Sub": "${NetworkStackName}-DataSubnetB" }

  Database:
    Type: AWS::RDS::DBInstance
    # 測試環境：刪除 stack 時不留快照（預設會留快照並持續收費）
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBInstanceIdentifier: savebite-db
      Engine: postgres
      EngineVersion: "16.13"            # 2026-11-27 查到的 PostgreSQL 16 預設小版本（只寫 "16" 不能建立新執行個體）
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: "20"
      StorageType: gp3
      StorageEncrypted: true
      DBName: savebite
      MasterUsername: savebite_admin
      ManageMasterUserPassword: true    # 密碼由 RDS 產生並存進 Secrets Manager，不經過我們的手
      MultiAZ: !Ref RdsMultiAz
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups:
        - !ImportValue { "Fn::Sub": "${NetworkStackName}-DbSg" }
      PubliclyAccessible: false
      BackupRetentionPeriod: 1
      MonitoringInterval: 0             # Learner Lab 不支援 Enhanced monitoring
      EnablePerformanceInsights: false
      DeletionProtection: false
      AutoMinorVersionUpgrade: true
      Tags: [{ Key: Name, Value: savebite-db }]

  # ---------- ElastiCache Redis（開發用單一節點） ----------
  RedisSubnetGroup:
    Type: AWS::ElastiCache::SubnetGroup
    Properties:
      CacheSubnetGroupName: savebite-redis-subnets
      Description: SaveBite Redis in private data subnets
      SubnetIds:
        - !ImportValue { "Fn::Sub": "${NetworkStackName}-DataSubnetA" }
        - !ImportValue { "Fn::Sub": "${NetworkStackName}-DataSubnetB" }

  RedisCluster:
    Type: AWS::ElastiCache::CacheCluster
    Properties:
      ClusterName: savebite-redis
      Engine: redis
      EngineVersion: "7.1"
      CacheNodeType: !Ref CacheNodeType
      NumCacheNodes: 1
      CacheSubnetGroupName: !Ref RedisSubnetGroup
      VpcSecurityGroupIds:
        - !ImportValue { "Fn::Sub": "${NetworkStackName}-RedisSg" }
      Tags: [{ Key: Name, Value: savebite-redis }]

  # ---------- Secrets Manager interface endpoint ----------
  # Lambda 在資料子網路，沒有對外路由，要靠這個 endpoint 讀 RDS 密碼。
  # 開啟 Private DNS 後，整個 VPC（包含 EC2）呼叫 Secrets Manager 都會走這裡。
  EndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: endpoint-sg
      GroupDescription: Interface VPC endpoints - HTTPS from app-sg and lambda-sg
      VpcId: !ImportValue { "Fn::Sub": "${NetworkStackName}-VpcId" }
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !ImportValue { "Fn::Sub": "${NetworkStackName}-AppSg" }
          Description: HTTPS from EC2
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !ImportValue { "Fn::Sub": "${NetworkStackName}-LambdaSg" }
          Description: HTTPS from Lambda
      Tags: [{ Key: Name, Value: endpoint-sg }]

  # lambda-sg 原本只能連 DB 與 Redis，這裡加上連 endpoint 的 443（隨 runtime stack 一起刪除）
  LambdaToEndpointEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !ImportValue { "Fn::Sub": "${NetworkStackName}-LambdaSg" }
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      DestinationSecurityGroupId: !Ref EndpointSecurityGroup
      Description: HTTPS to interface VPC endpoints

  SecretsManagerEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !ImportValue { "Fn::Sub": "${NetworkStackName}-VpcId" }
      VpcEndpointType: Interface
      ServiceName: !Sub com.amazonaws.${AWS::Region}.secretsmanager
      PrivateDnsEnabled: true
      SubnetIds:
        - !ImportValue { "Fn::Sub": "${NetworkStackName}-DataSubnetA" }
        - !ImportValue { "Fn::Sub": "${NetworkStackName}-DataSubnetB" }
      SecurityGroupIds: [!Ref EndpointSecurityGroup]

  # ---------- Lambda：逾時釋出、到期下架、安全網掃描 ----------
  ReleaseLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: /aws/lambda/savebite-release
      RetentionInDays: 7

  ReleaseFunction:
    Type: AWS::Lambda::Function
    DependsOn: [ReleaseLogGroup, LambdaToEndpointEgress]
    Properties:
      FunctionName: savebite-release
      Description: SaveBite release/expire/sweep (placeholder until the real code is deployed)
      Runtime: python3.12
      Handler: index.handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/LabRole
      Timeout: 30
      MemorySize: 256
      VpcConfig:
        SubnetIds:
          - !ImportValue { "Fn::Sub": "${NetworkStackName}-DataSubnetA" }
          - !ImportValue { "Fn::Sub": "${NetworkStackName}-DataSubnetB" }
        SecurityGroupIds:
          - !ImportValue { "Fn::Sub": "${NetworkStackName}-LambdaSg" }
      Environment:
        Variables:
          DB_HOST: !GetAtt Database.Endpoint.Address
          DB_PORT: !GetAtt Database.Endpoint.Port
          DB_NAME: savebite
          DB_SECRET_ARN: !GetAtt Database.MasterUserSecret.SecretArn
          REDIS_HOST: !GetAtt RedisCluster.RedisEndpoint.Address
          REDIS_PORT: !GetAtt RedisCluster.RedisEndpoint.Port
      Code:
        # 佔位程式：只驗證網路與權限（DB、Redis 的 TCP 連線、Secrets Manager 讀取），不改任何資料。
        # 正式的釋出邏輯（ARCHITECTURE.md §6.3）由 A 組員實作後取代。
        ZipFile: |
          """佔位用的 Lambda：只驗證網路與權限，正式的釋出邏輯由 A 組員實作後取代。"""
          import json
          import os
          import socket
          import time

          import boto3
          from botocore.config import Config


          def _tcp(host, port):
              start = time.time()
              try:
                  with socket.create_connection((host, int(port)), timeout=3):
                      return {"ok": True, "ms": round((time.time() - start) * 1000)}
              except OSError as exc:
                  return {"ok": False, "error": repr(exc)}


          def handler(event, context):
              result = {
                  "event": event,
                  "db": _tcp(os.environ["DB_HOST"], os.environ["DB_PORT"]),
                  "redis": _tcp(os.environ["REDIS_HOST"], os.environ["REDIS_PORT"]),
              }
              try:
                  sm = boto3.client(
                      "secretsmanager",
                      config=Config(connect_timeout=3, read_timeout=5, retries={"max_attempts": 1}),
                  )
                  secret = json.loads(sm.get_secret_value(SecretId=os.environ["DB_SECRET_ARN"])["SecretString"])
                  result["secretsmanager"] = {"ok": True, "has_password": bool(secret.get("password"))}
              except Exception as exc:  # noqa: BLE001  佔位程式只回報結果
                  result["secretsmanager"] = {"ok": False, "error": repr(exc)}
              print(json.dumps(result, default=str))
              return result

  # 非同步呼叫（Scheduler、EventBridge rule）的重試與失敗目的地（已驗證的設定，見 CONSOLE_SETUP.md §7）
  ReleaseEventInvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref ReleaseFunction
      Qualifier: $LATEST
      MaximumRetryAttempts: 2
      MaximumEventAgeInSeconds: 3600
      DestinationConfig:
        OnFailure:
          Destination: !ImportValue { "Fn::Sub": "${BaseStackName}-DlqArn" }

  # ---------- 安全網掃描：每 5 分鐘觸發一次（§6.3） ----------
  # 用 EventBridge rule，靠 Lambda resource-based policy 觸發，不需要執行角色
  SweepRule:
    Type: AWS::Events::Rule
    Properties:
      Name: savebite-sweep
      Description: Trigger the release Lambda sweep every 5 minutes
      ScheduleExpression: rate(5 minutes)
      State: ENABLED
      Targets:
        - Id: release-lambda
          Arn: !GetAtt ReleaseFunction.Arn
          Input: '{"type": "sweep"}'

  SweepRulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ReleaseFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt SweepRule.Arn

Outputs:
  AlbDnsName:
    Description: Open http://<this value>/health in a browser.
    Value: !GetAtt LoadBalancer.DNSName
    Export: { Name: !Sub "${AWS::StackName}-AlbDnsName" }
  AlbFullName:
    Value: !GetAtt LoadBalancer.LoadBalancerFullName
    Export: { Name: !Sub "${AWS::StackName}-AlbFullName" }
  TargetGroupFullName:
    Value: !GetAtt TargetGroup.TargetGroupFullName
    Export: { Name: !Sub "${AWS::StackName}-TargetGroupFullName" }
  AutoScalingGroupName:
    Value: !Ref AppAutoScalingGroup
    Export: { Name: !Sub "${AWS::StackName}-AsgName" }
  DbEndpoint:
    Value: !GetAtt Database.Endpoint.Address
    Export: { Name: !Sub "${AWS::StackName}-DbEndpoint" }
  DbSecretArn:
    Value: !GetAtt Database.MasterUserSecret.SecretArn
    Export: { Name: !Sub "${AWS::StackName}-DbSecretArn" }
  RedisEndpoint:
    Value: !GetAtt RedisCluster.RedisEndpoint.Address
    Export: { Name: !Sub "${AWS::StackName}-RedisEndpoint" }
  ReleaseLambdaArn:
    Value: !GetAtt ReleaseFunction.Arn
    Export: { Name: !Sub "${AWS::StackName}-ReleaseLambdaArn" }

# 只放工具設定（ruff、pytest），套件清單在 requirements*.txt

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
  "db: 需要本機 PostgreSQL（docker compose up）；連不上時自動略過",
]
